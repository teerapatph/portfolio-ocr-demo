<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <defs>
    <!-- Gradient for the icon -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" /> <!-- Emerald-500 -->
      <stop offset="100%" stop-color="#047857" /> <!-- Emerald-700 -->
    </linearGradient>
    
    <!-- Gradient for the text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46" /> <!-- Emerald-800 -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Blue-500 -->
    </linearGradient>
    
    <!-- Glow effect for the scanline -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background (transparent) -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Logo Icon Group -->
  <g transform="translate(30, 25)">
    <!-- Document outline -->
    <rect x="10" y="10" width="60" height="80" rx="8" ry="8" fill="none" stroke="url(#iconGradient)" stroke-width="6" />
    
    <!-- Document lines -->
    <line x1="25" y1="35" x2="55" y2="35" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="50" x2="45" y2="50" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="65" x2="55" y2="65" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Decorative corners for a "scanning" look -->
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
    <path d="M 60 0 L 80 0 L 80 20" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
    <path d="M 0 80 L 0 100 L 20 100" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
    <path d="M 60 100 L 80 100 L 80 80" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />

    <!-- Scanline with glow -->
    <line x1="0" y1="20" x2="80" y2="20" stroke="#3B82F6" stroke-width="3" filter="url(#glow)">
      <animate attributeName="y1" values="10;90;10" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y2" values="10;90;10" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Typography Group -->
  <g transform="translate(130, 85)">
    <!-- Main Text -->
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="46" font-weight="900" fill="url(#textGradient)" letter-spacing="-1">
      NEXUS
    </text>
    
    <!-- Subtitle Text -->
    <text x="0" y="30" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#6B7280" letter-spacing="4">
      AI OCR DEMO
    </text>
  </g>
</svg>
