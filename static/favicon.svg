<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient for the icon -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" /> <!-- Emerald-500 -->
      <stop offset="100%" stop-color="#047857" /> <!-- Emerald-700 -->
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Logo Icon Group scaled for 100x100 -->
  <g transform="translate(10, 0)">
    <!-- Document outline -->
    <rect x="10" y="10" width="60" height="80" rx="8" ry="8" fill="none" stroke="url(#iconGradient)" stroke-width="6" />
    
    <!-- Document lines -->
    <line x1="25" y1="35" x2="55" y2="35" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="50" x2="45" y2="50" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="65" x2="55" y2="65" stroke="url(#iconGradient)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Decorative corners for a "scanning" look -->
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
    <path d="M 60 0 L 80 0 L 80 20" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
    <path d="M 0 80 L 0 100 L 20 100" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
    <path d="M 60 100 L 80 100 L 80 80" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
